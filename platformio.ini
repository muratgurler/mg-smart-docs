[platformio]
src_dir = main
default_envs = jc1060p4-core

[env:jc1060p4-core]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36-1/platform-espressif32.zip
board = esp32-p4
framework = espidf

monitor_speed = 115200
extra_scripts =
    pre:tools/pio_hosted_memory_config.py
upload_speed = 460800
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 12582912
board_build.flash_mode = qio
board_build.partitions = partitions_p4.csv

; SDKCONFIG_DEFAULTS is set in the root CMakeLists.txt.
; Mobile profile import is handled as prepared JSON; no AI/image model dependencies are linked.

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DMG_MOBILE_PROFILE_IMPORT=1
